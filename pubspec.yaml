name: movie_app
description: "A new Flutter based movie app"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  flutter_bloc:
  dio:
  get_it:
  shared_preferences:
  reactive_button: 0.0.9
